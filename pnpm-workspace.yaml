packages:
  - wotaku-new
allowBuilds:
  '@parcel/watcher': true
  dprint: true
  esbuild: true
  vue-demi: true
configDependencies:
  '@pnpm/pacquet': 0.11.12
minimumReleaseAgeExclude:
  - '@vitest/mocker@5.1.2'
  - '@vitest/spy@5.1.2'
  - vitest@5.1.2
peerDependencyRules:
  ignoreMissing:
    - '@algolia/client-search'
    - search-insights
